
name: Build Android APK - Punch List V38

on:
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev patchelf
          python -m pip install --upgrade pip setuptools wheel virtualenv
          python -m pip install "buildozer>=1.5,<2" "cython==0.29.34"

      - name: Build Android APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PunchList-V38-APK
          path: bin/*.apk
          if-no-files-found: error
